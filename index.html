<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8f3"><title>四格日常 ♡</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#514b4b;background:#fffaf6}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}header{padding:23px 18px 8px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:11px;letter-spacing:2px;color:#a99595}h1{font-size:25px;margin:3px 0;font-weight:750}.shell{max-width:600px;margin:auto;padding-bottom:95px}.datebar{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px}.datebar input{border:1px solid #eadbd7;border-radius:12px;background:white;padding:10px;max-width:175px;color:#675b5b}.smallbtn{background:#f5e9e5;border-radius:12px;padding:10px 13px;color:#775e5d}.cards{display:grid;grid-template-columns:1fr 1fr;gap:11px;padding:10px 15px}.tile{min-height:190px;text-align:left;padding:17px 13px;border-radius:20px;display:flex;flex-direction:column;gap:12px;color:#4e4a4a;box-shadow:0 3px 12px #8c696111}.tile b{font-size:15px}.tile p{font-size:13px;line-height:1.65;white-space:pre-wrap;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;margin:0;color:#6e6868}.tile .hint{margin-top:auto;font-size:11px;opacity:.6}.peach{background:#fce9df}.mint{background:#e6f1e8}.lav{background:#f0eafa}.cream{background:#fff0d8}.panel{padding:16px;margin:8px 15px 18px;background:white;border:1px solid #f1e5e0;border-radius:20px}.panel h2{font-size:19px;margin:2px 0 14px}.muted{color:#9b8d8d;font-size:13px}.field{width:100%;border:1px solid #e8ddda;background:#fffdfb;border-radius:12px;padding:12px;margin:6px 0;outline-color:#d8aaa8}textarea.field{min-height:110px;resize:vertical;line-height:1.7}.primary{background:#c9919b;color:white;border-radius:12px;padding:12px 17px;font-weight:700}.outline{background:#fff4f1;color:#a46f78;border-radius:12px;padding:10px}.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1}.entry{padding:13px 0;border-bottom:1px solid #f2e9e6}.entry:last-child{border-bottom:0}.entry img{width:90px;height:90px;object-fit:cover;border-radius:12px}.entry p{white-space:pre-wrap;margin:5px 0;font-size:14px}.timeline{border-left:2px solid #e7bdc5;margin-left:45px;padding-left:17px}.timeentry{position:relative;padding:7px 0 17px}.timeentry:before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:#dba6af;left:-23px;top:13px}.timeentry time{position:absolute;right:calc(100% + 30px);white-space:nowrap;font-size:12px;color:#9c7b82}.notes{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sticky{padding:14px;min-height:115px;box-shadow:2px 4px 7px #8a75721c;white-space:pre-wrap;font-size:14px;line-height:1.7;overflow-wrap:anywhere}.sticky button{float:right;background:transparent;color:#887f7f}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#fffdfb;border-top:1px solid #efe3df;padding:9px 4px max(10px,env(safe-area-inset-bottom));z-index:4}.tabs button{background:transparent;color:#9c8e8e;font-size:11px;display:grid;gap:4px;justify-items:center;padding:3px}.tabs button.active{color:#bc7c8b;font-weight:800}.tabs span{font-size:23px}.hide{display:none!important}.overlay{position:fixed;inset:0;background:#443a3a77;z-index:6;display:flex;align-items:end;justify-content:center}.modal{background:#fffaf7;border-radius:24px 24px 0 0;padding:22px;width:100%;max-width:600px;max-height:88vh;overflow:auto}.modal h2{margin:0 0 12px}.pill{border-radius:20px;background:#f5ebe7;padding:8px 12px;font-size:12px}.pill.selected{background:#e7b9c3}.foodphoto{max-width:100%;max-height:180px;border-radius:12px;object-fit:contain}.topright{background:none;font-size:20px;color:#aa9090}.empty{padding:15px 0;color:#a99a9a;text-align:center;font-size:13px}.taskgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.taskbox{border-radius:16px;padding:12px;min-height:145px}.task{display:flex;gap:5px;font-size:13px;align-items:start;margin:8px 0}.task input{margin-top:3px}.task.done span{text-decoration:line-through;opacity:.5}footer{padding:8px 20px;text-align:center;color:#baa8a8;font-size:11px}</style></head><body><div class="shell"><header><div><div class="eyebrow">MY LITTLE DAYS ✿</div><h1>四格日常 ♡</h1></div><button class="smallbtn" id="todayBtn">今天</button></header><div class="datebar"><button class="smallbtn" id="prev">‹</button><input type="date" id="date"><button class="smallbtn" id="next">›</button></div><main id="main"></main><footer>把每一天，都收藏成喜歡的樣子 ♡</footer></div><nav class="tabs" id="nav"><button data-page="home" class="active"><span>▦</span>日記</button><button data-page="timeline"><span>◷</span>時間軸</button><button data-page="food"><span>🍰</span>美食</button><button data-page="gratitude"><span>💌</span>感恩</button><button data-page="tasks"><span>☑</span>艾森豪</button></nav><div class="overlay hide" id="overlay"><div class="modal" id="modal"></div></div><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>{let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`};let date=iso(new Date()),page='home';const KEY='daily-four-v3';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{}}catch{db={}};db.days??={};db.food??=[];db.notes??=[];db.tasks??=[];const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('儲存空間不足，請減少照片或備份資料。');return false}};const day=()=>db.days[date]??(db.days[date]={});const sections=[['food','🍰 吃了什麼','peach'],['timeline','🕒 時間軸','mint'],['thoughts','☁️ 碎碎念','lav'],['gratitude','💌 感恩日記','cream']];const listFor=(key)=>day()[key]||[];function render(){ $('#date').value=date;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));const m=$('#main');if(page==='home'){let d=day();m.innerHTML=`<div class="cards">${sections.map(([key,title,color])=>{let txt=key==='food'?db.food.filter(x=>x.date===date).map(x=>x.name).join('、'):key==='timeline'?listFor('events').map(x=>x.time+' '+x.text).join('\n'):key==='gratitude'?db.notes.filter(x=>x.date===date).map(x=>x.text).join('\n'):d.thoughts||'';return `<button class="tile ${color}" data-open="${key}"><b>${title}</b><p>${esc(txt||'今天想記錄什麼呢？')}</p><span class="hint">點一下查看／編輯 →</span></button>`}).join('')}</div><div class="panel"><h2>今天的小日子 🌷</h2><div class="muted">點四個格子，就能寫下今天的生活。每個格子的內容也會整理到自己的收藏頁。</div></div>`;m.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let k=b.dataset.open;page=k==='thoughts'?'home':k==='food'?'food':k==='timeline'?'timeline':'gratitude';render();if(k==='thoughts')editThoughts();else if(k==='food')openFood();else if(k==='timeline')openEvent();else openNote()});return}if(page==='timeline'){let ev=[...listFor('events')].sort((a,b)=>a.time.localeCompare(b.time));m.innerHTML=`<section class="panel"><h2>🕰️ ${date} 的時間軸</h2><button class="primary" id="addEvent">＋ 新增事件</button>${ev.length?`<div class="timeline" style="margin-top:18px">${ev.map(x=>`<div class="timeentry"><time>${esc(x.time)}</time><div class="flex"><span class="grow">${esc(x.text)}</span><button class="outline" data-del-event="${x.id}">刪除</button></div></div>`).join('')}</div>`:'<div class="empty">還沒有時間紀錄，新增第一件小事吧 ♡</div>'}</section>`;$('#addEvent').onclick=openEvent;m.querySelectorAll('[data-del-event]').forEach(b=>b.onclick=()=>{day().events=listFor('events').filter(x=>x.id!==b.dataset.delEvent);save();render()});return}if(page==='food'){let f=db.food.filter(x=>x.date===date);m.innerHTML=`<section class="panel"><h2>🍰 我的美食日記</h2><p class="muted">${date} · 收藏今天吃過的美味</p><button class="primary" id="addFood">＋ 記錄美食</button>${f.length?f.map(x=>`<div class="entry flex" style="align-items:start">${x.photo?`<img src="${x.photo}" alt="餐點照片">`:''}<div class="grow"><b>${esc(x.name)}</b><div class="muted">${esc(x.meal||'')} ${x.place?'· '+esc(x.place):''}</div><p>${esc(x.memo||'')}</p>${x.address?`<div class="muted">📍 ${esc(x.address)}</div>`:''}${x.lat!=null?`<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${encodeURIComponent(x.lat+','+x.lng)}">查看地圖</a>`:''}</div><button class="outline" data-del-food="${x.id}">刪除</button></div>`).join(''):'<div class="empty">還沒記錄美食，來收藏第一餐 🍓</div>'}</section><section class="panel"><h2>美食收藏總覽</h2><div class="muted">目前已收藏 ${db.food.length} 筆美食（跨日期）。切換上方日期可以查看當天的照片與紀錄。</div></section>`;$('#addFood').onclick=openFood;m.querySelectorAll('[data-del-food]').forEach(b=>b.onclick=()=>{db.food=db.food.filter(x=>x.id!==b.dataset.delFood);save();render()});return}if(page==='gratitude'){let n=db.notes.filter(x=>x.date===date);m.innerHTML=`<section class="panel"><h2>💌 感恩便利貼</h2><p class="muted">${date} · 今天值得感謝的小事</p><button class="primary" id="addNote">＋ 貼一張便利貼</button><div class="notes" style="margin-top:16px">${n.map(x=>`<div class="sticky" style="background:${x.color}"><button data-del-note="${x.id}">×</button>${esc(x.text)}</div>`).join('')}</div>${n.length?'':'<div class="empty">寫下今天的一件小確幸 ♡</div>'}</section>`;$('#addNote').onclick=openNote;m.querySelectorAll('[data-del-note]').forEach(b=>b.onclick=()=>{db.notes=db.notes.filter(x=>x.id!==b.dataset.delNote);save();render()});return}if(page==='tasks'){let names=['重要且緊急','重要不緊急','不重要但緊急','不重要不緊急'];let colors=['#fbe2e0','#e5f0e8','#fff0d6','#eee9f7'];m.innerHTML=`<section class="panel"><h2>☑ 艾森豪四象限</h2><p class="muted">輕量待辦管理 · 不影響生活日記</p><button class="primary" id="addTask">＋ 新增待辦</button><div class="taskgrid" style="margin-top:15px">${names.map((n,i)=>`<div class="taskbox" style="background:${colors[i]}"><b style="font-size:13px">${n}</b>${db.tasks.filter(t=>t.q===i).map(t=>`<label class="task ${t.done?'done':''}"><input type="checkbox" data-check="${t.id}" ${t.done?'checked':''}><span>${esc(t.text)}</span><button data-del-task="${t.id}" style="background:transparent">×</button></label>`).join('')}</div>`).join('')}</div></section>`;$('#addTask').onclick=openTask;m.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let t=db.tasks.find(x=>x.id===c.dataset.check);if(t)t.done=c.checked;save();render()});m.querySelectorAll('[data-del-task]').forEach(b=>b.onclick=()=>{db.tasks=db.tasks.filter(x=>x.id!==b.dataset.delTask);save();render()})}}
function modal(html,setup){$('#modal').innerHTML=`<div class="flex" style="justify-content:space-between"><h2>${html.title}</h2><button class="topright" id="close">×</button></div>${html.body}`;$('#overlay').classList.remove('hide');$('#close').onclick=close;setup?.()}function close(){$('#overlay').classList.add('hide')}$('#overlay').onclick=e=>{if(e.target===$('#overlay'))close()};function editThoughts(){modal({title:'☁️ 碎碎念樹洞',body:`<p class="muted">不用整理好心情，也不用寫得漂亮。這裡只屬於你。</p><textarea class="field" id="thought" rows="8" placeholder="今天想說什麼呢……">${esc(day().thoughts||'')}</textarea><button class="primary" id="saveThought">儲存心情</button><p class="muted">資料僅存在目前瀏覽器，尚未加密或跨裝置同步。</p>`},()=>{$('#saveThought').onclick=()=>{day().thoughts=$('#thought').value;save();close();render()}})}function openEvent(){modal({title:'🕰️ 新增時間紀錄',body:'<label>時間<input class="field" type="time" id="eventTime" value="12:00"></label><label>做了什麼？<textarea class="field" id="eventText" placeholder="例如：去咖啡廳、散步、下班……"></textarea></label><button class="primary" id="saveEvent">儲存事件</button>'},()=>{$('#saveEvent').onclick=()=>{let text=$('#eventText').value.trim();if(!text)return alert('請輸入事件內容');day().events??=[];day().events.push({id:crypto.randomUUID(),time:$('#eventTime').value,text});save();close();render()}})}function openNote(){modal({title:'💌 感恩便利貼',body:'<textarea class="field" id="noteText" placeholder="今天想感謝什麼呢？"></textarea><label>便利貼顏色 <select class="field" id="noteColor"><option value="#fce2e8">草莓粉</option><option value="#fff0c8">奶油黃</option><option value="#e1f0e5">薄荷綠</option><option value="#e9e8fc">薰衣草紫</option></select></label><button class="primary" id="saveNote">貼上便利貼</button>'},()=>{$('#saveNote').onclick=()=>{let text=$('#noteText').value.trim();if(!text)return alert('先寫一句話吧');db.notes.push({id:crypto.randomUUID(),date,text,color:$('#noteColor').value});save();close();render()}})}function openTask(){modal({title:'☑ 新增待辦',body:'<input class="field" id="taskText" placeholder="待辦事項"><select class="field" id="taskQ"><option value="0">重要且緊急</option><option value="1">重要不緊急</option><option value="2">不重要但緊急</option><option value="3">不重要不緊急</option></select><button class="primary" id="saveTask">新增待辦</button>'},()=>{$('#saveTask').onclick=()=>{let text=$('#taskText').value.trim();if(!text)return;db.tasks.push({id:crypto.randomUUID(),text,q:+$('#taskQ').value,done:false});save();close();render()}})}function openFood(){modal({title:'🍰 新增美食日記',body:'<input class="field" id="foodName" placeholder="餐點名稱 *"><select class="field" id="meal"><option>早餐</option><option>午餐</option><option>晚餐</option><option>下午茶</option><option>宵夜</option></select><input class="field" id="place" placeholder="店名（選填）"><input class="field" id="address" placeholder="地址（選填）"><button class="outline" id="locate" type="button">📍 取得目前位置（選填）</button><div class="muted" id="locStatus">定位只會在你按下按鈕後要求授權。</div><textarea class="field" id="foodMemo" placeholder="味道、心得、想記住的事……"></textarea><label>上傳照片（選填）<input class="field" type="file" accept="image/*" id="foodFile"></label><img class="foodphoto hide" id="preview" alt="照片預覽"><div style="margin-top:12px"><button class="primary" id="saveFood">儲存美食</button></div><p class="muted">照片會縮小後儲存在此瀏覽器，空間有限；請自行備份重要照片。</p>'},()=>{let pos=null,photo='';$('#locate').onclick=()=>{if(!navigator.geolocation){$('#locStatus').textContent='此瀏覽器不支援定位';return}navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lng:p.coords.longitude};$('#locStatus').textContent='已取得座標，可在紀錄中開啟地圖'},()=>{$('#locStatus').textContent='定位未成功，可以手動填寫地址'},{timeout:10000})};$('#foodFile').onchange=async e=>{let file=e.target.files?.[0];if(!file)return;if(file.size>15e6)return alert('照片過大，請換一張');try{let img=new Image();let url=URL.createObjectURL(file);await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});let scale=Math.min(1,900/img.width,900/img.height),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);photo=c.toDataURL('image/jpeg',.65);URL.revokeObjectURL(url);$('#preview').src=photo;$('#preview').classList.remove('hide')}catch{alert('無法讀取照片')}};$('#saveFood').onclick=()=>{let name=$('#foodName').value.trim();if(!name)return alert('請填寫餐點名稱');db.food.push({id:crypto.randomUUID(),date,name,meal:$('#meal').value,place:$('#place').value.trim(),address:$('#address').value.trim(),memo:$('#foodMemo').value.trim(),photo,...(pos||{})});if(save()){close();render()}else db.food.pop()}})}
$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('#date').onchange=e=>{if(e.target.value){date=e.target.value;render()}};function shift(n){let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);date=iso(d);render()}$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);$('#todayBtn').onclick=()=>{date=iso(new Date());page='home';render()};render();
</script></body></html>
