<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6e6df"><title>四格日常</title><style>:root{--bg:#fff8f3;--card:#fff;--ink:#534a4b;--accent:#db8c9b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,'Noto Sans TC',sans-serif}main{max-width:650px;margin:auto;padding:20px 14px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:27px;margin:8px 0}button,select,input,textarea{font:inherit}button,select,input[type=date]{border:1px solid #e6d9d7;background:var(--card);border-radius:14px;padding:10px;color:var(--ink)}button{cursor:pointer}nav{display:flex;gap:8px;margin:18px 0}nav button{flex:1}.selected{background:var(--accent);color:white}section{display:none}section.show{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border-radius:20px;padding:13px;min-height:210px;background:var(--card);box-shadow:0 3px 15px #00000009}.tile:nth-child(1){background:#ffede2}.tile:nth-child(2){background:#e6f3e9}.tile:nth-child(3){background:#f3e9f9}.tile:nth-child(4){background:#fff1db}.tile input{width:100%;border:0;background:transparent;font-weight:700;color:#514b4a;font-size:15px}.tile textarea{width:100%;height:128px;resize:vertical;border:0;outline:0;background:transparent;color:#514b4a;font-size:14px;line-height:1.6}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}.bar button{padding:7px 11px}canvas{width:100%;height:150px;border:1px dashed #d6bfc0;border-radius:12px;touch-action:none;background:#ffffffb8}.small{font-size:12px;opacity:.75}.task{display:flex;gap:7px;margin:8px 0}.task input[type=text]{width:100%;min-width:0}.task.done input[type=text]{text-decoration:line-through;opacity:.6}.taskbox{padding:14px;background:var(--card);border-radius:18px;margin:12px 0}.taskbox h3{margin:0 0 8px}footer{position:fixed;bottom:0;left:0;right:0;text-align:center;background:var(--bg);padding:12px;border-top:1px solid #e6d9d7}#notice{font-size:12px;opacity:.75}@media(max-width:380px){.tile{padding:9px}.tile input{font-size:13px}}</style></head><body><main><header><div><div class="small">MY LITTLE DAYS ✿</div><h1>四格日常 ♡</h1></div><select id="theme"><option value="cream">🍓 奶油韓系</option><option value="mint">🌿 清新綠</option><option value="retro">📜 復古棕</option><option value="night">🌙 夜間紫</option></select></header><div class="bar"><label>日期 <input type="date" id="date"></label><span id="notice">自動儲存在此裝置</span></div><nav><button class="selected" data-tab="diary">📖 生活日記</button><button data-tab="tasks">✅ 艾森豪</button></nav><section id="diary" class="show"><div class="grid" id="grid"></div><p class="small">✎ 每格都可以改標題、打字和手寫。手寫儲存在該日期的畫布中。</p><div class="bar"><button id="export">📸 匯出日記圖片</button></div></section><section id="tasks"><h2>今天的四象限待辦</h2><div id="tasklist"></div></section></main><footer>願每天都有值得收藏的小事 ✿</footer><script>
const $=s=>document.querySelector(s),KEY='daily-four-v1';let db={};try{db=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};const defaults=['🍰 吃了什麼','🕒 時間軸','💭 碎碎念','💗 感恩日記'],taskNames=['重要 × 緊急','重要 × 不緊急','不重要 × 緊急','不重要 × 不緊急'];let current=new Date().toLocaleDateString('en-CA'),canvases=[];$('#date').value=current;function store(){localStorage.setItem(KEY,JSON.stringify(db));$('#notice').textContent='✓ 已儲存於此裝置'}function entry(){return db[current]??(db[current]={titles:[...defaults],texts:['','','',''],drawings:['','','',''],tasks:[[],[],[],[]]})}function render(){let e=entry();e.titles??=[...defaults];e.texts??=['','','',''];e.drawings??=['','','',''];e.tasks??=[[],[],[],[]];$('#grid').innerHTML='';canvases=[];for(let i=0;i<4;i++){let div=document.createElement('div');div.className='tile';div.innerHTML=`<input aria-label="象限標題"/><textarea placeholder="今天想記錄什麼呢？"></textarea><div class="bar"><button type="button" class="erase">清除手寫</button></div><canvas width="320" height="200"></canvas>`;let title=div.querySelector('input'),area=div.querySelector('textarea'),canvas=div.querySelector('canvas'),ctx=canvas.getContext('2d');title.value=e.titles[i];area.value=e.texts[i];title.oninput=()=>{e.titles[i]=title.value;store()};area.oninput=()=>{e.texts[i]=area.value;store()};ctx.lineWidth=3;ctx.lineCap='round';ctx.strokeStyle='#765e62';if(e.drawings[i]){let img=new Image();img.onload=()=>ctx.drawImage(img,0,0);img.src=e.drawings[i]}let down=false;function pos(ev){let r=canvas.getBoundingClientRect();return [(ev.clientX-r.left)*canvas.width/r.width,(ev.clientY-r.top)*canvas.height/r.height]}canvas.addEventListener('pointerdown',ev=>{down=true;canvas.setPointerCapture(ev.pointerId);let [x,y]=pos(ev);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+.01,y+.01);ctx.stroke()});canvas.addEventListener('pointermove',ev=>{if(!down)return;let [x,y]=pos(ev);ctx.lineTo(x,y);ctx.stroke()});function end(){if(!down)return;down=false;e.drawings[i]=canvas.toDataURL('image/png');store()}canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);div.querySelector('.erase').onclick=()=>{ctx.clearRect(0,0,320,200);e.drawings[i]='';store()};$('#grid').append(div);canvases.push(canvas)}renderTasks()}function renderTasks(){let e=entry(),root=$('#tasklist');root.innerHTML='';taskNames.forEach((name,i)=>{let box=document.createElement('div');box.className='taskbox';let h=document.createElement('h3');h.textContent=name;box.append(h);e.tasks[i].forEach((task,j)=>{let row=document.createElement('div');row.className='task'+(task.done?' done':'');let check=document.createElement('input');check.type='checkbox';check.checked=!!task.done;check.onchange=()=>{task.done=check.checked;store();renderTasks()};let input=document.createElement('input');input.type='text';input.value=task.text;input.placeholder='輸入待辦事項';input.oninput=()=>{task.text=input.value;store()};let del=document.createElement('button');del.textContent='×';del.onclick=()=>{e.tasks[i].splice(j,1);store();renderTasks()};row.append(check,input,del);box.append(row)});let add=document.createElement('button');add.textContent='＋ 新增待辦';add.onclick=()=>{e.tasks[i].push({text:'',done:false});store();renderTasks()};box.append(add);root.append(box)})}$('#date').onchange=ev=>{current=ev.target.value;render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('selected',x===b));document.querySelectorAll('section').forEach(s=>s.classList.toggle('show',s.id===b.dataset.tab))});const themes={cream:['#fff8f3','#fff','#534a4b','#db8c9b'],mint:['#eff9f0','#fff','#3d5e4e','#80b69a'],retro:['#f5e9d7','#fffaf0','#604d3d','#aa8160'],night:['#28243b','#3a3450','#f7eafa','#9a86d0']};function setTheme(v){let t=themes[v]||themes.cream;['--bg','--card','--ink','--accent'].forEach((k,i)=>document.documentElement.style.setProperty(k,t[i]));localStorage.setItem('daily-four-theme',v)}$('#theme').value=localStorage.getItem('daily-four-theme')||'cream';setTheme($('#theme').value);$('#theme').onchange=e=>setTheme(e.target.value);$('#export').onclick=()=>{let c=document.createElement('canvas');c.width=1000;c.height=1300;let x=c.getContext('2d'),e=entry();x.fillStyle='#fff8f3';x.fillRect(0,0,1000,1300);x.fillStyle='#574a4c';x.font='bold 48px sans-serif';x.fillText('四格日常 ♡',55,75);x.font='28px sans-serif';x.fillText(current,60,120);let fills=['#ffede2','#e6f3e9','#f3e9f9','#fff1db'];for(let i=0;i<4;i++){let col=i%2,row=Math.floor(i/2),px=45+col*470,py=160+row*550;x.fillStyle=fills[i];x.fillRect(px,py,440,525);x.fillStyle='#534a4b';x.font='bold 28px sans-serif';x.fillText(e.titles[i].slice(0,14),px+18,py+45);x.font='22px sans-serif';let lines=[];for(let line of e.texts[i].split('\n')){while(line.length>19){lines.push(line.slice(0,19));line=line.slice(19)}lines.push(line)}lines.slice(0,11).forEach((l,k)=>x.fillText(l,px+18,py+88+k*32));if(e.drawings[i]){let img=new Image();img.onload=()=>{x.drawImage(img,px+15,py+310,410,195);if(i===3)save()};img.src=e.drawings[i]}else if(i===3)save()}function save(){let a=document.createElement('a');a.download='四格日常-'+current+'.png';a.href=c.toDataURL('image/png');a.click()}};render();
</script></body></html>
